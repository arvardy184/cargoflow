# Local development infrastructure for CargoFlow.
# Credentials here are development-only defaults; override them via .env for any shared environment.
services:
  mysql:
    image: mysql:8.4
    container_name: cargoflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cargoflow_root_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cargoflow}
      MYSQL_USER: ${MYSQL_USER:-cargoflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cargoflow_dev}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - '${MYSQL_HOST_PORT:-3307}:3306'
    volumes:
      - cargoflow-mysql-data:/var/lib/mysql
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  cargoflow-mysql-data:
